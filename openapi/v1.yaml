openapi: 3.1.0
info:
  title: ContentFlow API
  version: 1.0.0
  description: Typed, workspace-scoped content persistence. JSON request bodies are limited to 1 MiB and text fields to 500 KiB of UTF-8.
servers:
  - url: /api/v1
security:
  - bearerToken: []
  - sessionCookie: []
paths:
  /content:
    get:
      operationId: listContent
      parameters:
        - { name: type, in: query, schema: { $ref: '#/components/schemas/ContentType' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ContentStatus' } }
        - { name: q, in: query, description: Case-insensitive Unicode-normalized working-title prefix., schema: { type: string, x-max-utf8-bytes: 512000 } }
      responses:
        '200':
          description: Summary-only results. Typed content, transcripts, sections, and signed URLs are never included.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ContentSummary' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createContent
      description: Creates one permanently stored item with a server-owned ULID and revision 1.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateContentRequest' }
      responses:
        '201': { $ref: '#/components/responses/MutationCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
  /content/batches:
    post:
      operationId: batchCreateContent
      description: Creates 1 to 50 standalone typed items and one completed receipt atomically. The top-level operation_id is the sole idempotency key and binds to the exact request bytes for 24 hours. YouTube items cannot contain script sections. Receipts contain no content, source links, or provenance.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchCreateRequest' }
      responses:
        '201': { $ref: '#/components/responses/BatchMutationCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /content/{id}:
    parameters:
      - { $ref: '#/components/parameters/ContentID' }
    get:
      operationId: getContent
      responses:
        '200':
          description: Complete typed item. YouTube sections are inline.
          content: { application/json: { schema: { $ref: '#/components/schemas/ContentItem' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: replaceContent
      description: Full replacement. Omitted optional typed fields clear. Identity, discriminator, creation, and expiry cannot change. YouTube transcript is always required and may be an empty string.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReplaceContentRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/MutationOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
    delete:
      operationId: deleteContent
      description: Permanently removes the item and its section documents. Owner browser session only.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RevisionMutationRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/MutationOK' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /content/{id}/transcript:
    parameters:
      - { $ref: '#/components/parameters/ContentID' }
    get:
      operationId: getYouTubeTranscript
      description: Returns canonical transcript input only. It never returns metadata, description, or script sections and never falls back to the script.
      responses:
        '200':
          description: Transcript-only response.
          content: { application/json: { schema: { $ref: '#/components/schemas/Transcript' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The transcript contains only Unicode whitespace.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, examples: { missing: { value: { error: transcript_missing } } } } }
components:
  securitySchemes:
    bearerToken: { type: http, scheme: bearer }
    sessionCookie: { type: apiKey, in: cookie, name: contentflow_session }
  parameters:
    ContentID:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ULID' }
  responses:
    MutationCreated:
      description: Bounded mutation result.
      content: { application/json: { schema: { $ref: '#/components/schemas/MutationResult' } } }
    MutationOK:
      description: Bounded mutation result.
      content: { application/json: { schema: { $ref: '#/components/schemas/MutationResult' } } }
    BatchMutationCreated:
      description: Bounded result for every atomically created item. Matching retries return these exact stored values without creating duplicates.
      content: { application/json: { schema: { $ref: '#/components/schemas/BatchMutationResult' } } }
    BadRequest:
      description: Invalid input, discriminator mismatch, or omitted YouTube transcript.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Missing or invalid identity.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Insufficient scope or owner session required.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Missing or out-of-workspace content.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Revision conflict, operation ID conflict, or missing transcript. Revision conflicts include the current item.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    TooLarge:
      description: JSON over 1 MiB, a text field over 500 KiB, a parent document over 900 KiB, or a Firestore document over its platform limit.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    TooManyRequests:
      description: The authenticated client exceeded its request rate limit.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ServiceUnavailable:
      description: The transaction could not commit. No item or completed receipt is created.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    ULID:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    ContentType:
      type: string
      enum: [topic, youtube, linkedin, x, instagram, tiktok, email, substack]
    ContentStatus:
      type: string
      enum: [idea, draft, ready, published]
    Text:
      type: string
      x-max-utf8-bytes: 512000
    OperationID:
      $ref: '#/components/schemas/ULID'
    Section:
      type: object
      additionalProperties: false
      required: [position]
      properties:
        id: { $ref: '#/components/schemas/ULID', description: Required for surviving sections on replacement; omitted for a new server-assigned section. }
        position: { type: integer, minimum: 0 }
        title: { $ref: '#/components/schemas/Text' }
        body: { $ref: '#/components/schemas/Text' }
    YouTubeContent:
      type: object
      additionalProperties: false
      required: [transcript]
      properties:
        topic: { $ref: '#/components/schemas/Text' }
        icp: { $ref: '#/components/schemas/Text' }
        angle: { $ref: '#/components/schemas/Text' }
        cta: { $ref: '#/components/schemas/Text' }
        publishing_title: { $ref: '#/components/schemas/Text' }
        description: { $ref: '#/components/schemas/Text' }
        transcript: { $ref: '#/components/schemas/Text' }
        sections: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/Section' } }
    LinkedInContent:
      type: object
      additionalProperties: false
      properties: { body: { $ref: '#/components/schemas/Text' } }
    XContent:
      type: object
      additionalProperties: false
      properties: { body: { $ref: '#/components/schemas/Text' } }
    TopicContent:
      type: object
      additionalProperties: false
      properties:
        source: { $ref: '#/components/schemas/Text' }
        source_url: { type: string, maxLength: 8192, description: External HTTP or HTTPS source URL. }
    InstagramContent:
      type: object
      additionalProperties: false
      properties:
        script: { $ref: '#/components/schemas/Text' }
        caption: { $ref: '#/components/schemas/Text' }
    TikTokContent:
      type: object
      additionalProperties: false
      properties: { script: { $ref: '#/components/schemas/Text' } }
    EmailContent:
      type: object
      additionalProperties: false
      properties:
        subject: { $ref: '#/components/schemas/Text' }
        body: { $ref: '#/components/schemas/Text' }
    SubstackContent:
      type: object
      additionalProperties: false
      properties:
        headline: { $ref: '#/components/schemas/Text' }
        subheadline: { $ref: '#/components/schemas/Text' }
        body: { $ref: '#/components/schemas/Text' }
    CreateCommon:
      type: object
      required: [type, working_title, status, operation_id, content]
      properties:
        topic_id: { type: string, description: Optional topic group ID in the same workspace. Empty means standalone. }
        format: { type: string, maxLength: 100 }
        document_url: { type: string, maxLength: 8192, description: External HTTP or HTTPS document URL. }
        video_url: { type: string, maxLength: 8192, description: External HTTP or HTTPS video URL such as Frame.io. }
        type: { $ref: '#/components/schemas/ContentType' }
        working_title: { $ref: '#/components/schemas/Text' }
        status: { $ref: '#/components/schemas/ContentStatus' }
        operation_id: { $ref: '#/components/schemas/OperationID' }
        scheduled_at: { type: string, format: date-time, description: Optional planned publish date. Omitting it on replace clears it. }
    ReplaceCommon:
      allOf:
        - { $ref: '#/components/schemas/CreateCommon' }
        - type: object
          required: [revision]
          properties: { revision: { type: integer, minimum: 1 } }
    TopicCreate:
      allOf:
        - { $ref: '#/components/schemas/CreateCommon' }
        - type: object
          properties: { type: { const: topic }, content: { $ref: '#/components/schemas/TopicContent' } }
      unevaluatedProperties: false
    YouTubeCreate:
      allOf:
        - { $ref: '#/components/schemas/CreateCommon' }
        - type: object
          properties: { type: { const: youtube }, content: { $ref: '#/components/schemas/YouTubeContent' } }
      unevaluatedProperties: false
    LinkedInCreate:
      allOf:
        - { $ref: '#/components/schemas/CreateCommon' }
        - type: object
          properties: { type: { const: linkedin }, content: { $ref: '#/components/schemas/LinkedInContent' } }
      unevaluatedProperties: false
    XCreate:
      allOf:
        - { $ref: '#/components/schemas/CreateCommon' }
        - type: object
          properties: { type: { const: x }, content: { $ref: '#/components/schemas/XContent' } }
      unevaluatedProperties: false
    InstagramCreate:
      allOf:
        - { $ref: '#/components/schemas/CreateCommon' }
        - type: object
          properties: { type: { const: instagram }, content: { $ref: '#/components/schemas/InstagramContent' } }
      unevaluatedProperties: false
    TikTokCreate:
      allOf:
        - { $ref: '#/components/schemas/CreateCommon' }
        - type: object
          properties: { type: { const: tiktok }, content: { $ref: '#/components/schemas/TikTokContent' } }
      unevaluatedProperties: false
    EmailCreate:
      allOf:
        - { $ref: '#/components/schemas/CreateCommon' }
        - type: object
          properties: { type: { const: email }, content: { $ref: '#/components/schemas/EmailContent' } }
      unevaluatedProperties: false
    SubstackCreate:
      allOf:
        - { $ref: '#/components/schemas/CreateCommon' }
        - type: object
          properties: { type: { const: substack }, content: { $ref: '#/components/schemas/SubstackContent' } }
      unevaluatedProperties: false
    CreateContentRequest:
      oneOf:
        - { $ref: '#/components/schemas/TopicCreate' }
        - { $ref: '#/components/schemas/YouTubeCreate' }
        - { $ref: '#/components/schemas/LinkedInCreate' }
        - { $ref: '#/components/schemas/XCreate' }
        - { $ref: '#/components/schemas/InstagramCreate' }
        - { $ref: '#/components/schemas/TikTokCreate' }
        - { $ref: '#/components/schemas/EmailCreate' }
        - { $ref: '#/components/schemas/SubstackCreate' }
      discriminator:
        propertyName: type
        mapping:
          topic: '#/components/schemas/TopicCreate'
          youtube: '#/components/schemas/YouTubeCreate'
          linkedin: '#/components/schemas/LinkedInCreate'
          x: '#/components/schemas/XCreate'
          instagram: '#/components/schemas/InstagramCreate'
          tiktok: '#/components/schemas/TikTokCreate'
          email: '#/components/schemas/EmailCreate'
          substack: '#/components/schemas/SubstackCreate'
    BatchYouTubeContent:
      type: object
      additionalProperties: false
      required: [transcript]
      properties:
        topic: { $ref: '#/components/schemas/Text' }
        icp: { $ref: '#/components/schemas/Text' }
        angle: { $ref: '#/components/schemas/Text' }
        cta: { $ref: '#/components/schemas/Text' }
        publishing_title: { $ref: '#/components/schemas/Text' }
        description: { $ref: '#/components/schemas/Text' }
        transcript: { $ref: '#/components/schemas/Text' }
        sections: { type: array, maxItems: 0, items: { $ref: '#/components/schemas/Section' } }
    BatchItemCommon:
      type: object
      required: [type, working_title, status, content]
      properties:
        topic_id: { type: string }
        format: { type: string, maxLength: 100 }
        document_url: { type: string, maxLength: 8192 }
        video_url: { type: string, maxLength: 8192 }
        type: { $ref: '#/components/schemas/ContentType' }
        working_title: { $ref: '#/components/schemas/Text' }
        status: { $ref: '#/components/schemas/ContentStatus' }
        scheduled_at: { type: string, format: date-time, description: Optional planned publish date. Omitting it on replace clears it. }
    BatchTopicCreate:
      allOf:
        - { $ref: '#/components/schemas/BatchItemCommon' }
        - type: object
          properties: { type: { const: topic }, content: { $ref: '#/components/schemas/TopicContent' } }
      unevaluatedProperties: false
    BatchYouTubeCreate:
      allOf:
        - { $ref: '#/components/schemas/BatchItemCommon' }
        - type: object
          properties: { type: { const: youtube }, content: { $ref: '#/components/schemas/BatchYouTubeContent' } }
      unevaluatedProperties: false
    BatchLinkedInCreate:
      allOf:
        - { $ref: '#/components/schemas/BatchItemCommon' }
        - type: object
          properties: { type: { const: linkedin }, content: { $ref: '#/components/schemas/LinkedInContent' } }
      unevaluatedProperties: false
    BatchXCreate:
      allOf:
        - { $ref: '#/components/schemas/BatchItemCommon' }
        - type: object
          properties: { type: { const: x }, content: { $ref: '#/components/schemas/XContent' } }
      unevaluatedProperties: false
    BatchInstagramCreate:
      allOf:
        - { $ref: '#/components/schemas/BatchItemCommon' }
        - type: object
          properties: { type: { const: instagram }, content: { $ref: '#/components/schemas/InstagramContent' } }
      unevaluatedProperties: false
    BatchTikTokCreate:
      allOf:
        - { $ref: '#/components/schemas/BatchItemCommon' }
        - type: object
          properties: { type: { const: tiktok }, content: { $ref: '#/components/schemas/TikTokContent' } }
      unevaluatedProperties: false
    BatchEmailCreate:
      allOf:
        - { $ref: '#/components/schemas/BatchItemCommon' }
        - type: object
          properties: { type: { const: email }, content: { $ref: '#/components/schemas/EmailContent' } }
      unevaluatedProperties: false
    BatchSubstackCreate:
      allOf:
        - { $ref: '#/components/schemas/BatchItemCommon' }
        - type: object
          properties: { type: { const: substack }, content: { $ref: '#/components/schemas/SubstackContent' } }
      unevaluatedProperties: false
    BatchCreateItem:
      oneOf:
        - { $ref: '#/components/schemas/BatchTopicCreate' }
        - { $ref: '#/components/schemas/BatchYouTubeCreate' }
        - { $ref: '#/components/schemas/BatchLinkedInCreate' }
        - { $ref: '#/components/schemas/BatchXCreate' }
        - { $ref: '#/components/schemas/BatchInstagramCreate' }
        - { $ref: '#/components/schemas/BatchTikTokCreate' }
        - { $ref: '#/components/schemas/BatchEmailCreate' }
        - { $ref: '#/components/schemas/BatchSubstackCreate' }
      discriminator: { propertyName: type }
    BatchCreateRequest:
      type: object
      additionalProperties: false
      required: [operation_id, items]
      properties:
        operation_id: { $ref: '#/components/schemas/OperationID', description: The sole idempotency key for the complete batch. }
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/BatchCreateItem' }
    TopicReplace:
      allOf:
        - { $ref: '#/components/schemas/ReplaceCommon' }
        - type: object
          properties: { type: { const: topic }, content: { $ref: '#/components/schemas/TopicContent' } }
      unevaluatedProperties: false
    YouTubeReplace:
      allOf:
        - { $ref: '#/components/schemas/ReplaceCommon' }
        - type: object
          properties: { type: { const: youtube }, content: { $ref: '#/components/schemas/YouTubeContent' } }
      unevaluatedProperties: false
    LinkedInReplace:
      allOf:
        - { $ref: '#/components/schemas/ReplaceCommon' }
        - type: object
          properties: { type: { const: linkedin }, content: { $ref: '#/components/schemas/LinkedInContent' } }
      unevaluatedProperties: false
    XReplace:
      allOf:
        - { $ref: '#/components/schemas/ReplaceCommon' }
        - type: object
          properties: { type: { const: x }, content: { $ref: '#/components/schemas/XContent' } }
      unevaluatedProperties: false
    InstagramReplace:
      allOf:
        - { $ref: '#/components/schemas/ReplaceCommon' }
        - type: object
          properties: { type: { const: instagram }, content: { $ref: '#/components/schemas/InstagramContent' } }
      unevaluatedProperties: false
    TikTokReplace:
      allOf:
        - { $ref: '#/components/schemas/ReplaceCommon' }
        - type: object
          properties: { type: { const: tiktok }, content: { $ref: '#/components/schemas/TikTokContent' } }
      unevaluatedProperties: false
    EmailReplace:
      allOf:
        - { $ref: '#/components/schemas/ReplaceCommon' }
        - type: object
          properties: { type: { const: email }, content: { $ref: '#/components/schemas/EmailContent' } }
      unevaluatedProperties: false
    SubstackReplace:
      allOf:
        - { $ref: '#/components/schemas/ReplaceCommon' }
        - type: object
          properties: { type: { const: substack }, content: { $ref: '#/components/schemas/SubstackContent' } }
      unevaluatedProperties: false
    ReplaceContentRequest:
      oneOf:
        - { $ref: '#/components/schemas/TopicReplace' }
        - { $ref: '#/components/schemas/YouTubeReplace' }
        - { $ref: '#/components/schemas/LinkedInReplace' }
        - { $ref: '#/components/schemas/XReplace' }
        - { $ref: '#/components/schemas/InstagramReplace' }
        - { $ref: '#/components/schemas/TikTokReplace' }
        - { $ref: '#/components/schemas/EmailReplace' }
        - { $ref: '#/components/schemas/SubstackReplace' }
      discriminator: { propertyName: type }
    RevisionMutationRequest:
      type: object
      additionalProperties: false
      required: [operation_id, revision]
      properties:
        operation_id: { $ref: '#/components/schemas/OperationID' }
        revision: { type: integer, minimum: 1 }
    ServerFields:
      type: object
      required: [id, revision, created_at, updated_at, expires_at]
      properties:
        id: { $ref: '#/components/schemas/ULID' }
        revision: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: Legacy timestamp retained for compatibility. Content is stored permanently. }
        scheduled_at: { type: string, format: date-time, description: Optional planned publish date. Omitting it on replace clears it. }
    ItemCommon:
      type: object
      required: [type, working_title, status, content]
      properties:
        topic_id: { type: string, description: Optional topic group ID in the same workspace. Empty means standalone. }
        format: { type: string, maxLength: 100 }
        document_url: { type: string, maxLength: 8192, description: External HTTP or HTTPS document URL. }
        video_url: { type: string, maxLength: 8192, description: External HTTP or HTTPS video URL such as Frame.io. }
        type: { $ref: '#/components/schemas/ContentType' }
        working_title: { type: string }
        status: { $ref: '#/components/schemas/ContentStatus' }
    TopicItem:
      allOf:
        - { $ref: '#/components/schemas/ServerFields' }
        - { $ref: '#/components/schemas/ItemCommon' }
        - type: object
          properties: { type: { const: topic }, content: { $ref: '#/components/schemas/TopicContent' } }
      unevaluatedProperties: false
    YouTubeItem:
      allOf:
        - { $ref: '#/components/schemas/ServerFields' }
        - { $ref: '#/components/schemas/ItemCommon' }
        - type: object
          properties: { type: { const: youtube }, content: { $ref: '#/components/schemas/YouTubeContent' } }
      unevaluatedProperties: false
    LinkedInItem:
      allOf:
        - { $ref: '#/components/schemas/ServerFields' }
        - { $ref: '#/components/schemas/ItemCommon' }
        - type: object
          properties: { type: { const: linkedin }, content: { $ref: '#/components/schemas/LinkedInContent' } }
      unevaluatedProperties: false
    XItem:
      allOf:
        - { $ref: '#/components/schemas/ServerFields' }
        - { $ref: '#/components/schemas/ItemCommon' }
        - type: object
          properties: { type: { const: x }, content: { $ref: '#/components/schemas/XContent' } }
      unevaluatedProperties: false
    InstagramItem:
      allOf:
        - { $ref: '#/components/schemas/ServerFields' }
        - { $ref: '#/components/schemas/ItemCommon' }
        - type: object
          properties: { type: { const: instagram }, content: { $ref: '#/components/schemas/InstagramContent' } }
      unevaluatedProperties: false
    TikTokItem:
      allOf:
        - { $ref: '#/components/schemas/ServerFields' }
        - { $ref: '#/components/schemas/ItemCommon' }
        - type: object
          properties: { type: { const: tiktok }, content: { $ref: '#/components/schemas/TikTokContent' } }
      unevaluatedProperties: false
    EmailItem:
      allOf:
        - { $ref: '#/components/schemas/ServerFields' }
        - { $ref: '#/components/schemas/ItemCommon' }
        - type: object
          properties: { type: { const: email }, content: { $ref: '#/components/schemas/EmailContent' } }
      unevaluatedProperties: false
    SubstackItem:
      allOf:
        - { $ref: '#/components/schemas/ServerFields' }
        - { $ref: '#/components/schemas/ItemCommon' }
        - type: object
          properties: { type: { const: substack }, content: { $ref: '#/components/schemas/SubstackContent' } }
      unevaluatedProperties: false
    ContentItem:
      oneOf:
        - { $ref: '#/components/schemas/TopicItem' }
        - { $ref: '#/components/schemas/YouTubeItem' }
        - { $ref: '#/components/schemas/LinkedInItem' }
        - { $ref: '#/components/schemas/XItem' }
        - { $ref: '#/components/schemas/InstagramItem' }
        - { $ref: '#/components/schemas/TikTokItem' }
        - { $ref: '#/components/schemas/EmailItem' }
        - { $ref: '#/components/schemas/SubstackItem' }
      discriminator: { propertyName: type }
    ContentSummary:
      type: object
      additionalProperties: false
      required: [id, type, status, working_title, revision, created_at, updated_at, expires_at, asset_counts]
      properties:
        topic_id: { type: string, description: Optional topic group ID in the same workspace. Empty means standalone. }
        format: { type: string, maxLength: 100 }
        document_url: { type: string, maxLength: 8192, description: External HTTP or HTTPS document URL. }
        video_url: { type: string, maxLength: 8192, description: External HTTP or HTTPS video URL such as Frame.io. }
        id: { $ref: '#/components/schemas/ULID' }
        type: { $ref: '#/components/schemas/ContentType' }
        status: { $ref: '#/components/schemas/ContentStatus' }
        working_title: { type: string }
        revision: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
