    Transcript:
      type: object
      additionalProperties: false
      required: [id, revision, transcript]
      properties:
        id: { $ref: '#/components/schemas/ULID' }
        revision: { type: integer, minimum: 1 }
        transcript: { $ref: '#/components/schemas/Text' }
    MutationResult:
      type: object
      additionalProperties: false
      required: [operation_id, item_ids, revisions, expires_at, status]
      properties:
        operation_id: { $ref: '#/components/schemas/OperationID' }
        item_ids: { type: array, maxItems: 1, items: { $ref: '#/components/schemas/ULID' } }
        revisions: { type: array, maxItems: 1, items: { type: integer, minimum: 1 } }
        expires_at: { type: array, maxItems: 1, items: { type: string, format: date-time } }
        status: { type: string, enum: [created, updated, deleted] }
    BatchMutationResult:
      type: object
      additionalProperties: false
      required: [operation_id, item_ids, revisions, expires_at, status]
      properties:
        operation_id: { $ref: '#/components/schemas/OperationID' }
        item_ids: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/ULID' } }
