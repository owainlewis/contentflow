services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: contentflow
      POSTGRES_PASSWORD: contentflow
      POSTGRES_DB: contentflow
    volumes:
      # Postgres 18 images want the parent directory mounted, not data/.
      - contentflow-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentflow -d contentflow"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  contentflow:
    build: .
    environment:
      CONTENTFLOW_ENV: development
      CONTENTFLOW_ADDR: :8080
      CONTENTFLOW_PRIVATE_ADDR: :8081
      CONTENTFLOW_LOCAL_PROXY_AUTH: "true"
      # The published port below is the public loopback boundary for this container listener.
      CONTENTFLOW_LOOPBACK_PORT_PROXY: "true"
      CONTENTFLOW_ASSET_DIR: /var/lib/contentflow/assets
      CONTENTFLOW_DATABASE_URL: postgres://contentflow:contentflow@postgres:5432/contentflow?sslmode=disable
    ports:
      - "127.0.0.1:3100:8080"
    expose:
      - "8081"
    volumes:
      - contentflow-assets:/var/lib/contentflow/assets
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/contentflow", "healthcheck", "http://127.0.0.1:8080/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

volumes:
  contentflow-assets:
  contentflow-postgres:
