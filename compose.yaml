services:
  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command:
      - gcloud
      - beta
      - emulators
      - firestore
      - start
      - --host-port=0.0.0.0:8080
      - --project=contentflow-local
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  contentflow:
    build: .
    environment:
      CONTENTFLOW_ENV: development
      CONTENTFLOW_ADDR: :8080
      CONTENTFLOW_PRIVATE_ADDR: :8081
      CONTENTFLOW_LOCAL_PROXY_AUTH: "true"
      CONTENTFLOW_ASSET_DIR: /var/lib/contentflow/assets
      FIRESTORE_EMULATOR_HOST: firestore:8080
    ports:
      - "3000:8080"
    expose:
      - "8081"
    volumes:
      - contentflow-assets:/var/lib/contentflow/assets
    depends_on:
      firestore:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/contentflow", "healthcheck", "http://127.0.0.1:8080/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

volumes:
  contentflow-assets:
